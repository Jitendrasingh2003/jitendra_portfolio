<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c1b" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00ffaa" />
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#bgGrad2)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="510" rx="12" fill="none" stroke="url(#borderGrad2)" stroke-width="2" stroke-dasharray="10 5" />
  <rect x="35" y="35" width="730" height="480" rx="8" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1" />

  <!-- Decorative Corner Accents -->
  <path d="M 35 65 L 35 35 L 65 35" fill="none" stroke="#00d2ff" stroke-width="3" />
  <path d="M 765 65 L 765 35 L 735 35" fill="none" stroke="#00d2ff" stroke-width="3" />
  <path d="M 35 485 L 35 515 L 65 515" fill="none" stroke="#00d2ff" stroke-width="3" />
  <path d="M 765 485 L 765 515 L 735 515" fill="none" stroke="#00d2ff" stroke-width="3" />

  <!-- Header -->
  <text x="400" y="90" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#00d2ff" letter-spacing="4">PROFESSIONAL CERTIFICATION</text>
  <text x="400" y="120" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" fill="#8892b0" letter-spacing="2">ISSUED BY SIMPLILEARN &amp; SKILLUP</text>

  <line x1="300" y1="135" x2="500" y2="135" stroke="url(#cyanGrad)" stroke-width="2" />

  <!-- Recipient -->
  <text x="400" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#a8b2d1">This is awarded to</text>
  <text x="400" y="230" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="38" font-weight="800" fill="#ffffff" filter="url(#glow2)">JITENDRA SINGH</text>

  <!-- Description -->
  <text x="400" y="275" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="15" fill="#ccd6f6">for successfully mastering advanced domain competencies in</text>
  <text x="400" y="305" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#00ffaa">Software Testing with Generative AI</text>
  <text x="400" y="335" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" fill="#8892b0">Automated QA Workflows, Defect Prediction, Prompt Engineering &amp; LLM Validation</text>

  <!-- Seal & Badge -->
  <g transform="translate(400, 420)">
    <circle r="38" fill="url(#cyanGrad)" opacity="0.2" />
    <circle r="30" fill="none" stroke="#00d2ff" stroke-width="2" />
    <polygon points="0,-18 6,-6 18,-4 9,5 11,17 0,11 -11,17 -9,5 -18,-4 -6,-6" fill="#00d2ff" />
  </g>

  <!-- Dates & Signatures -->
  <text x="120" y="440" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Date Issued</text>
  <text x="120" y="460" font-family="'Fira Code', monospace" font-size="13" fill="#00d2ff">May 7, 2026</text>

  <text x="680" y="440" text-anchor="end" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Credential ID</text>
  <text x="680" y="460" text-anchor="end" font-family="'Fira Code', monospace" font-size="13" fill="#00d2ff">SKILLUP-QA-AI-9636</text>
</svg>
